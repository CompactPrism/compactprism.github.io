		:root {
			--taskbar-h: 36px;
			--win-face: #c0c0c0;
			--title-active: linear-gradient(90deg, #000080, #1084d0);
			--title-inactive: linear-gradient(90deg, #7b7d7b, #b5b6b5);
			--bevel-out: inset -1px -1px #0a0a0a, inset 1px 1px #fff, inset -2px -2px #808080, inset 2px 2px #dfdfdf;
			--bevel-in: inset -1px -1px #fff, inset 1px 1px #0a0a0a, inset -2px -2px #dfdfdf, inset 2px 2px #808080;
			--bevel-field: inset -1px -1px #fff, inset 1px 1px #808080, inset -2px -2px #dfdfdf, inset 2px 2px #0a0a0a;
		}
		* { box-sizing: border-box; margin: 0; padding: 0; }
		html, body { height: 100%; overflow: hidden; }
		body {
			font-family: Tahoma, 'MS Sans Serif', 'Segoe UI', Verdana, sans-serif;
			font-size: 13px;
			background: #008080;
			background-image: radial-gradient(circle at 30% 30%, #0d9494 0%, #008080 55%, #005f5f 100%);
			user-select: none;
			-webkit-user-select: none;
			touch-action: manipulation;
		}

		/* ---------- Boot screen ---------- */
		#boot {
			position: fixed; inset: 0; z-index: 99999;
			background: #000; color: #c0c0c0;
			display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
			font-family: 'Courier New', monospace;
			transition: opacity .4s;
		}
		#boot.hidden { opacity: 0; pointer-events: none; }
		#boot .logo { font-size: 34px; color: #fff; letter-spacing: 2px; }
		#boot .logo span { color: #1084d0; }
		#boot .bar {
			width: 240px; height: 16px; border: 1px solid #c0c0c0; padding: 2px;
		}
		#boot .bar i {
			display: block; height: 100%; width: 0; background: #1084d0;
			animation: bootfill 1.1s steps(12) forwards;
		}
		@keyframes bootfill { to { width: 100%; } }
		#boot small { color: #808080; }

		/* ---------- Desktop icons ---------- */
		#desktop {
			position: fixed; inset: 0 0 var(--taskbar-h) 0;
			padding: 8px 4px;
			display: flex; flex-direction: column; flex-wrap: wrap;
			align-content: flex-start; gap: 2px;
			overflow: hidden;
		}
		.dicon {
			width: 92px; padding: 6px 2px;
			display: flex; flex-direction: column; align-items: center; gap: 4px;
			cursor: pointer; border: 1px dotted transparent;
			text-align: center;
		}
		.dicon:focus-visible, .dicon.selected { border-color: rgba(255,255,255,.6); }
		.dicon .glyph {
			font-size: 38px; line-height: 48px; height: 48px;
			filter: drop-shadow(1px 2px 1px rgba(0,0,0,.45));
		}
		.dicon .thumb {
			width: 48px; height: 48px; object-fit: cover;
			border: 2px solid #fff; box-shadow: 1px 2px 3px rgba(0,0,0,.45);
			background: #000;
		}
		.dicon .thumbwrap { position: relative; height: 48px; }
		.dicon .thumbwrap::after {
			content: '↗'; position: absolute; left: -4px; bottom: -4px;
			width: 14px; height: 14px; line-height: 14px; font-size: 10px;
			background: #fff; color: #000080; border: 1px solid #808080;
		}
		.dicon .label {
			color: #fff; text-shadow: 1px 1px 2px #000;
			font-size: 12px; line-height: 1.25; padding: 1px 3px;
		}
		.dicon.selected .label { background: #000080; text-shadow: none; }

		/* ---------- Windows ---------- */
		.window {
			position: absolute;
			min-width: 280px; min-height: 160px;
			background: var(--win-face);
			box-shadow: var(--bevel-out), 4px 6px 14px rgba(0,0,0,.35);
			padding: 3px;
			display: flex; flex-direction: column;
			resize: both; overflow: hidden;
			animation: winopen .12s ease-out;
		}
		@keyframes winopen { from { transform: scale(.92); opacity: .4; } }
		.window.maximized {
			top: 0 !important; left: 0 !important;
			width: 100% !important; height: calc(100% - var(--taskbar-h)) !important;
			resize: none;
		}
		.window.minimized { display: none; }
		.titlebar {
			height: 26px; flex: 0 0 auto;
			background: var(--title-inactive);
			color: #fff; display: flex; align-items: center; gap: 6px;
			padding: 0 3px 0 6px; cursor: default;
		}
		.window.active .titlebar { background: var(--title-active); }
		.titlebar .t-icon { font-size: 14px; }
		.titlebar .t-icon img { width: 16px; height: 16px; object-fit: cover; display: block; border: 1px solid #fff; }
		.titlebar .t-text {
			flex: 1; font-weight: bold; font-size: 12.5px;
			white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
		}
		.titlebar .t-btns { display: flex; gap: 2px; }
		.titlebar button {
			width: 22px; height: 20px;
			background: var(--win-face); box-shadow: var(--bevel-out);
			border: 0; font-family: inherit; font-size: 11px; font-weight: bold;
			color: #000; cursor: pointer; line-height: 1;
		}
		.titlebar button:active { box-shadow: var(--bevel-in); }
		.win-body {
			flex: 1; margin-top: 3px; background: #fff;
			box-shadow: var(--bevel-field);
			padding: 3px; overflow: hidden; position: relative;
		}
		.win-body iframe { width: 100%; height: 100%; border: 0; background: #fff; }
		body.dragging iframe { pointer-events: none; }
		body.dragging { cursor: move; }
		.win-scroll { height: 100%; overflow: auto; padding: 14px 16px; user-select: text; -webkit-user-select: text; }
		.win-scroll h1 { font-size: 20px; margin-bottom: 10px; color: #000080; }
		.win-scroll h2 { font-size: 15px; margin: 16px 0 6px; color: #000080; border-bottom: 1px solid #c0c0c0; padding-bottom: 3px; }
		.win-scroll p, .win-scroll li { line-height: 1.5; margin-bottom: 8px; }
		.win-scroll ul { padding-left: 20px; }
		.win-scroll a { color: #0000cc; }
		.win-scroll video { width: 100%; max-width: 480px; display: block; margin: 8px 0; border: 2px solid #c0c0c0; }

		/* ---------- Projects folder ---------- */
		.folder-group { margin-bottom: 6px; }
		.folder-group h2 {
			font-size: 13px; color: #fff; background: linear-gradient(90deg, #000080, #1084d0);
			padding: 3px 8px; margin: 8px 0 6px; border: 0;
		}
		.folder-grid { display: flex; flex-wrap: wrap; gap: 4px; }
		.fitem {
			width: 108px; padding: 8px 4px;
			display: flex; flex-direction: column; align-items: center; gap: 5px;
			cursor: pointer; border: 1px dotted transparent; text-align: center;
		}
		.fitem:hover { background: #e2eaf5; border-color: #9db9dd; }
		.fitem img {
			width: 56px; height: 56px; object-fit: cover;
			border: 1px solid #808080; background: #000;
		}
		.fitem .fname { font-size: 12px; line-height: 1.25; }
		.fitem .fmeta { font-size: 10px; color: #666; }

		/* ---------- Taskbar ---------- */
		#taskbar {
			position: fixed; left: 0; right: 0; bottom: 0; height: var(--taskbar-h);
			background: var(--win-face); box-shadow: var(--bevel-out);
			display: flex; align-items: center; gap: 4px; padding: 3px 4px;
			z-index: 50000;
		}
		#startbtn {
			height: 28px; padding: 0 10px 0 6px;
			display: flex; align-items: center; gap: 5px;
			background: var(--win-face); box-shadow: var(--bevel-out);
			border: 0; font-family: inherit; font-weight: bold; font-size: 13px; cursor: pointer;
			flex: 0 0 auto;
		}
		#startbtn .s-logo { font-size: 16px; }
		#startbtn:active, #startbtn.open { box-shadow: var(--bevel-in); }
		#taskbtns {
			flex: 1; display: flex; gap: 4px; overflow: hidden; height: 28px;
		}
		.taskbtn {
			flex: 1 1 0; max-width: 170px; min-width: 40px; height: 28px;
			display: flex; align-items: center; gap: 5px; padding: 0 8px;
			background: var(--win-face); box-shadow: var(--bevel-out);
			border: 0; font-family: inherit; font-size: 12px; cursor: pointer;
			white-space: nowrap; overflow: hidden;
		}
		.taskbtn span { overflow: hidden; text-overflow: ellipsis; }
		.taskbtn .t-icon { flex: 0 0 auto; font-size: 13px; display: flex; }
		.taskbtn .t-icon img { width: 16px; height: 16px; object-fit: cover; border: 1px solid #808080; }
		.taskbtn.active { box-shadow: var(--bevel-in); background: #dfdfdf; font-weight: bold; }
		#tray {
			flex: 0 0 auto; height: 28px; padding: 0 10px;
			display: flex; align-items: center; gap: 8px;
			box-shadow: var(--bevel-field); font-size: 12px;
		}

		/* ---------- Start menu ---------- */
		#startmenu {
			position: fixed; left: 3px; bottom: calc(var(--taskbar-h) + 2px);
			width: 260px; background: var(--win-face);
			box-shadow: var(--bevel-out), 4px 6px 14px rgba(0,0,0,.4);
			padding: 3px; display: none; z-index: 60000;
		}
		#startmenu.open { display: flex; }
		#startmenu .banner {
			width: 26px; background: linear-gradient(#000080, #1084d0);
			color: #fff; writing-mode: vertical-rl; transform: rotate(180deg);
			display: flex; align-items: center; justify-content: flex-start;
			padding: 10px 0; font-weight: bold; font-size: 15px; letter-spacing: 1px;
			flex: 0 0 auto;
		}
		#startmenu .items { flex: 1; display: flex; flex-direction: column; padding: 2px 0; }
		.sm-item {
			display: flex; align-items: center; gap: 10px;
			padding: 8px 10px; cursor: pointer; position: relative;
			border: 0; background: none; font-family: inherit; font-size: 13px; text-align: left;
			color: #000; text-decoration: none;
		}
		.sm-item .sm-icon { font-size: 18px; width: 22px; text-align: center; }
		.sm-item:hover, .sm-item.hover { background: #000080; color: #fff; }
		.sm-item .arrow { margin-left: auto; font-size: 10px; }
		.sm-sep { height: 0; border-top: 1px solid #808080; border-bottom: 1px solid #fff; margin: 3px 2px; }
		#submenu-projects {
			position: absolute; left: 100%; bottom: -4px;
			width: 250px; max-height: min(430px, 72vh); overflow-y: auto;
			background: var(--win-face); box-shadow: var(--bevel-out), 4px 6px 14px rgba(0,0,0,.4);
			padding: 3px; display: none; color: #000;
		}
		.sm-item.open > #submenu-projects { display: block; }
		#submenu-projects .sub-group {
			font-size: 11px; font-weight: bold; color: #444;
			padding: 6px 8px 3px; border-bottom: 1px solid #d5d5d5; margin-bottom: 2px;
		}
		.sub-item {
			display: flex; align-items: center; gap: 8px; width: 100%;
			padding: 6px 8px; cursor: pointer; border: 0; background: none;
			font-family: inherit; font-size: 12.5px; text-align: left; color: #000;
		}
		.sub-item:hover { background: #000080; color: #fff; }
		.sub-item img { width: 20px; height: 20px; object-fit: cover; border: 1px solid #808080; flex: 0 0 auto; }

		/* ---------- Contact / misc content ---------- */
		.contact-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
		.contact-row .c-icon { font-size: 18px; width: 24px; text-align: center; }
		.btnrow { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
		.btn98 {
			display: inline-block; padding: 6px 14px;
			background: var(--win-face); box-shadow: var(--bevel-out);
			color: #000 !important; text-decoration: none; font-size: 12.5px; cursor: pointer;
			border: 0; font-family: inherit;
		}
		.btn98:active { box-shadow: var(--bevel-in); }

		/* ---------- Mobile ---------- */
		@media (max-width: 700px) {
			.dicon { width: 76px; }
			.window { resize: none; }
			#startmenu { width: min(300px, calc(100vw - 8px)); }
			#submenu-projects {
				position: static; width: auto; max-height: 45vh;
				box-shadow: var(--bevel-field); margin: 2px 0 2px 20px;
			}
			.taskbtn { min-width: 34px; padding: 0 6px; }
			#tray .traydate { display: none; }
		}
	</style>
</head>

			projects:  { title: 'Projects', icon: '📁', type: 'projects', w: 700, h: 540 },
			portfolio: { title: 'Full Portfolio - Freddie Cross', icon: '📄', type: 'iframe', src: 'GameDevPortPub.html', w: 900, h: 620 },
			contact:   { title: 'Contact', icon: '📧', type: 'tpl', tpl: 'tpl-contact', w: 440, h: 420 },
			recycle:   { title: 'Recycle Bin', icon: '🗑️', type: 'tpl', tpl: 'tpl-recycle', w: 400, h: 260 },
			shutdown:  { title: 'Shut Down', icon: '🔌', type: 'tpl', tpl: 'tpl-shutdown', w: 380, h: 260 }
		};
		PROJECTS.forEach(function (p) {
			APPS['prj-' + p.id] = { title: p.title, iconImg: p.img, icon: '🎮', type: 'iframe', src: p.page, w: 900, h: 620 };
		});

		var DESKTOP_ICONS = [
			{ app: 'about', icon: '👨‍💻', label: 'About Me' },
			{ app: 'projects', icon: '📁', label: 'Projects' },
			{ app: 'portfolio', icon: '📄', label: 'Full Portfolio' },
			{ app: 'contact', icon: '📧', label: 'Contact' },
			{ app: 'prj-phonyphantoms', img: 'images/phonyphantoms.png', label: 'Phony Phantoms' },
			{ app: 'prj-autoants', img: 'images/autoants2title.png', label: 'Auto Ants 2' },
			{ app: 'prj-wackytaxi', img: 'images/WT_01.jpg', label: 'Wacky Taxi' },
			{ app: 'prj-dissertation', img: 'images/dissertationcover.png', label: 'Dissertation' },
			{ app: 'recycle', icon: '🗑️', label: 'Recycle Bin' }
		];

		/* ================= Helpers ================= */
		var $ = function (sel, root) { return (root || document).querySelector(sel); };
		var desktop = $('#desktop'), taskbtns = $('#taskbtns'),
			startbtn = $('#startbtn'), startmenu = $('#startmenu');
		var zTop = 100, openCount = 0;
		var windows = {}; // appId -> { el, taskbtn }
		var isSmall = function () { return window.innerWidth <= 700; };

		function el(tag, cls, html) {
			var e = document.createElement(tag);
			if (cls) e.className = cls;
			if (html != null) e.innerHTML = html;
			return e;
		}

		/* ================= Desktop icons ================= */
		DESKTOP_ICONS.forEach(function (d) {
			var ic = el('div', 'dicon');
			ic.tabIndex = 0;
			if (d.img) {
				ic.appendChild(el('div', 'thumbwrap', '<img class="thumb" src="' + d.img + '" alt="">'));
			} else {
				ic.appendChild(el('div', 'glyph', d.icon));
			}
			ic.appendChild(el('div', 'label', d.label));
			ic.addEventListener('click', function () {
				selectIcon(ic);
				openApp(d.app);
			});
			ic.addEventListener('keydown', function (ev) {
				if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); openApp(d.app); }
			});
			desktop.appendChild(ic);
		});
		function selectIcon(ic) {
			desktop.querySelectorAll('.dicon.selected').forEach(function (n) { n.classList.remove('selected'); });
			ic.classList.add('selected');
		}
		desktop.addEventListener('click', function (ev) {
			if (ev.target === desktop) {
				desktop.querySelectorAll('.dicon.selected').forEach(function (n) { n.classList.remove('selected'); });
			}
		});

		/* ================= Window manager ================= */
		function openApp(id) {
			closeStartMenu();
			var w = windows[id];
			if (w) {
				w.el.classList.remove('minimized');
				focusWindow(id);
				return;
			}
			var app = APPS[id];
			if (!app) return;

			var win = el('div', 'window');
			win.dataset.app = id;

			var iconHtml = app.iconImg ? '<img src="' + app.iconImg + '" alt="">' : app.icon;
			var tb = el('div', 'titlebar',
				'<span class="t-icon">' + iconHtml + '</span>' +
				'<span class="t-text">' + app.title + '</span>');
			var btns = el('div', 't-btns');
			var bMin = el('button', null, '_'); bMin.title = 'Minimize'; bMin.setAttribute('aria-label', 'Minimize');
			var bMax = el('button', null, '□'); bMax.title = 'Maximize'; bMax.setAttribute('aria-label', 'Maximize');
			var bCls = el('button', null, '✕'); bCls.title = 'Close'; bCls.setAttribute('aria-label', 'Close');
			btns.appendChild(bMin); btns.appendChild(bMax); btns.appendChild(bCls);
			tb.appendChild(btns);
			win.appendChild(tb);

			var body = el('div', 'win-body');
			if (app.type === 'iframe') {
				var fr = document.createElement('iframe');
				fr.src = app.src;
				fr.title = app.title;
				body.appendChild(fr);
			} else if (app.type === 'tpl') {
				body.appendChild(document.getElementById(app.tpl).content.cloneNode(true));
			} else if (app.type === 'projects') {
				body.appendChild(buildProjectsFolder());
			}
			win.appendChild(body);

			// Size & cascade position
			var maxW = window.innerWidth - 20, maxH = window.innerHeight - 20 - 36;
			win.style.width = Math.min(app.w, maxW) + 'px';
			win.style.height = Math.min(app.h, maxH) + 'px';
			var off = 24 * (openCount % 8);
			win.style.left = Math.max(6, Math.min(60 + off, maxW - Math.min(app.w, maxW))) + 'px';
			win.style.top = Math.max(6, Math.min(30 + off, maxH - Math.min(app.h, maxH))) + 'px';
			openCount++;

			desktop.parentNode.insertBefore(win, $('#taskbar'));

			// Taskbar button
			var tbtn = el('button', 'taskbtn', '<span class="t-icon">' + iconHtml + '</span><span>' + app.title + '</span>');
			tbtn.addEventListener('click', function () {
				if (win.classList.contains('minimized')) {
					win.classList.remove('minimized');
					focusWindow(id);
				} else if (win.classList.contains('active')) {
					minimizeWindow(id);
				} else {
					focusWindow(id);
				}
			});
			taskbtns.appendChild(tbtn);

			windows[id] = { el: win, taskbtn: tbtn };

			// Controls
			bCls.addEventListener('click', function () { closeWindow(id); });
			bMin.addEventListener('click', function () { minimizeWindow(id); });
			bMax.addEventListener('click', function () { win.classList.toggle('maximized'); });
			tb.addEventListener('dblclick', function (ev) {
				if (ev.target.tagName !== 'BUTTON') win.classList.toggle('maximized');
			});
			win.addEventListener('pointerdown', function () { focusWindow(id); });

			// In-window app-launcher buttons (e.g. About window shortcuts)
			body.querySelectorAll('[data-app]').forEach(function (b) {
				b.addEventListener('click', function () { openApp(b.dataset.app); });
			});

			makeDraggable(win, tb);
			if (isSmall()) win.classList.add('maximized');
			focusWindow(id);
		}

		function focusWindow(id) {
			Object.keys(windows).forEach(function (k) {
				windows[k].el.classList.remove('active');
				windows[k].taskbtn.classList.remove('active');
			});
			var w = windows[id];
			if (!w) return;
			w.el.classList.add('active');
			w.taskbtn.classList.add('active');
			w.el.style.zIndex = ++zTop;
		}

		function minimizeWindow(id) {
			var w = windows[id];
			if (!w) return;
			w.el.classList.add('minimized');
			w.el.classList.remove('active');
			w.taskbtn.classList.remove('active');
		}

		function closeWindow(id) {
			var w = windows[id];
			if (!w) return;
			w.el.remove();
			w.taskbtn.remove();
			delete windows[id];
		}

		function makeDraggable(win, handle) {
			var sx, sy, sl, st, dragging = false;
			handle.addEventListener('pointerdown', function (ev) {
				if (ev.target.tagName === 'BUTTON' || win.classList.contains('maximized')) return;
				dragging = true;
				sx = ev.clientX; sy = ev.clientY;
				sl = win.offsetLeft; st = win.offsetTop;
				document.body.classList.add('dragging');
				handle.setPointerCapture(ev.pointerId);
				ev.preventDefault();
			});
			handle.addEventListener('pointermove', function (ev) {
				if (!dragging) return;
				var nl = sl + (ev.clientX - sx), nt = st + (ev.clientY - sy);
				nl = Math.max(-win.offsetWidth + 60, Math.min(nl, window.innerWidth - 60));
				nt = Math.max(0, Math.min(nt, window.innerHeight - 36 - 28));
				win.style.left = nl + 'px';
				win.style.top = nt + 'px';
			});
			function stop() { dragging = false; document.body.classList.remove('dragging'); }
			handle.addEventListener('pointerup', stop);
			handle.addEventListener('pointercancel', stop);
		}

		/* ================= Projects folder ================= */
		function buildProjectsFolder() {
			var scroll = el('div', 'win-scroll');
			scroll.style.padding = '8px';
			GROUPS.forEach(function (g) {
				var grp = el('div', 'folder-group');
				grp.appendChild(el('h2', null, g));
				var grid = el('div', 'folder-grid');
				PROJECTS.filter(function (p) { return p.group === g; }).forEach(function (p) {
					var it = el('div', 'fitem');
					it.tabIndex = 0;
					it.innerHTML = '<img src="' + p.img + '" alt="">' +
						'<div class="fname">' + p.title + '</div>' +
						'<div class="fmeta">' + p.meta + '</div>';
					it.addEventListener('click', function () { openApp('prj-' + p.id); });
					it.addEventListener('keydown', function (ev) {
						if (ev.key === 'Enter') openApp('prj-' + p.id);
					});
					grid.appendChild(it);
				});
				grp.appendChild(grid);
				scroll.appendChild(grp);
			});
			return scroll;
		}

		/* ================= Start menu ================= */
		var submenu = $('#submenu-projects');
		GROUPS.forEach(function (g) {
			submenu.appendChild(el('div', 'sub-group', g));
			PROJECTS.filter(function (p) { return p.group === g; }).forEach(function (p) {
				var b = el('button', 'sub-item', '<img src="' + p.img + '" alt="">' + p.title);
				b.addEventListener('click', function (ev) {
					ev.stopPropagation();
					openApp('prj-' + p.id);
				});
				submenu.appendChild(b);
			});
		});

		var smProjects = $('#sm-projects');
		smProjects.addEventListener('click', function (ev) {
			if (ev.target.closest('#submenu-projects')) return;
			smProjects.classList.toggle('open');
		});
		if (window.matchMedia('(pointer: fine)').matches) {
			smProjects.addEventListener('mouseenter', function () { smProjects.classList.add('open'); });
			smProjects.addEventListener('mouseleave', function () { smProjects.classList.remove('open'); });
		}

		startbtn.addEventListener('click', function (ev) {
			ev.stopPropagation();
			var open = startmenu.classList.toggle('open');
			startbtn.classList.toggle('open', open);
			startbtn.setAttribute('aria-expanded', open);
			if (!open) smProjects.classList.remove('open');
		});
		startmenu.querySelectorAll('.sm-item[data-app]').forEach(function (b) {
			b.addEventListener('click', function () { openApp(b.dataset.app); });
		});
		startmenu.querySelectorAll('a.sm-item').forEach(function (a) {
			a.addEventListener('click', closeStartMenu);
		});
		function closeStartMenu() {
			startmenu.classList.remove('open');
			startbtn.classList.remove('open');
			startbtn.setAttribute('aria-expanded', 'false');
			smProjects.classList.remove('open');
		}
		document.addEventListener('pointerdown', function (ev) {
			if (!ev.target.closest('#startmenu') && !ev.target.closest('#startbtn')) closeStartMenu();
		});
		document.addEventListener('keydown', function (ev) {
			if (ev.key === 'Escape') closeStartMenu();
		});

		/* ================= Clock ================= */
		function tick() {
			var now = new Date();
			$('#trayclock').textContent =
				String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
			$('#traydate').textContent = now.toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' });
		}
		tick();
		setInterval(tick, 15000);

		/* ================= Boot ================= */
		var boot = $('#boot');
		function endBoot() {
			boot.classList.add('hidden');
			setTimeout(function () { boot.remove(); }, 500);
		}
		boot.addEventListener('click', endBoot);
		setTimeout(endBoot, 1500);

		// Open the About window on first visit so the desktop isn't empty
		setTimeout(function () { if (!isSmall()) openApp('about'); }, 1700);
	})();
	</script>

</body>
</html>
